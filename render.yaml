services:
  - type: web
    name: sudoku
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 允許連線的前端來源（例如 GitHub Pages 網址）；沒設定就是不限制。
      - key: GAME_ALLOWED_ORIGIN
        sync: false
